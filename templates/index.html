<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pepper Bacterial Spot Detector</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; text-align: center; }
        .result { margin-top: 20px; padding: 20px; border-radius: 10px; }
        .diseased { background: #ffe0e0; }
        .healthy { background: #e0ffe0; }
        img { max-width: 300px; margin-top: 20px; border-radius: 8px; }
        .confidence { font-size: 1.2em; margin-top: 10px; }
        input[type="file"] { margin: 20px 0; }
        button { padding: 10px 20px; font-size: 1em; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Pepper Bacterial Spot Detector</h1>
    <p>Upload a photo of a pepper leaf to check if it's healthy or has Bacterial Spot.</p>

    <form method="POST" action="/predict" enctype="multipart/form-data">
        <input type="file" name="file" accept="image/*" required>
        <br>
        <button type="submit">Predict</button>
    </form>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if label %}
        <div class="result {{ 'diseased' if label == 'Bacterial_Spot' else 'healthy' }}">
            <h2>{{ label }}</h2>
            <div class="confidence">Confidence: {{ confidence }}</div>
        </div>
        <img src="data:image/jpeg;base64,{{ image }}" alt="Uploaded leaf">
    {% endif %}
</body>
</html>
